# Triggers the alert job every weekday at 6:30 pm IST (13:00 UTC), after the Indian market closes.
# Needed on free hosting, where the app sleeps and its own scheduler can't run.
#
# Setup (GitHub repo -> Settings -> Secrets and variables -> Actions -> New repository secret):
#   API_URL      your backend URL, e.g. https://risk-copilot-api.onrender.com   (no trailing slash)
#   CRON_SECRET  the same value as CRON_SECRET on Render
name: Daily alerts

on:
  schedule:
    - cron: "0 13 * * 1-5"
  workflow_dispatch: # adds a "Run workflow" button to test it by hand

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the backend (free plan can take ~1 minute)
        run: curl --silent --show-error --retry 5 --retry-delay 15 --retry-all-errors --max-time 90 "${{ secrets.API_URL }}/api/health"

      - name: Run the alert job
        run: |
          curl --fail-with-body --silent --show-error --max-time 600 \
            -X POST "${{ secrets.API_URL }}/api/cron/daily-alerts" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}"
